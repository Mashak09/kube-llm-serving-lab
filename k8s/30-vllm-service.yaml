apiVersion: v1 # core ubernetes API, version 1
kind: Service # service provides a stapble internal address for pods
metadata:
  name: vllm # service name also the DNS name inside the cluster
  namespace: llm # this is the name by which we identify our pod
spec:
  type: ClusterIP # internal only, nothing is exposed outside of the cluster
  selector:
    app: vllm # pods with the ĺabel set in the deployment
  ports:
    - port: 8000 # this is the port the service listens to
      targetPort: 8000 # port inside the container
